services:

  api:
    build:
      context: ./api

    ports:
      - "3000"

    environment:
      MESSAGE: ${MESSAGE}

    depends_on:
      - postgres

    networks:
      - infra-network


  postgres:

    image: postgres:17

    environment:
      POSTGRES_USER: ${POSTGRES_USER}

      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      POSTGRES_DB: ${POSTGRES_DB}


    volumes:
      - postgres_data:/var/lib/postgresql/data


    ports:
      - "5432:5432"


    networks:
      - infra-network



volumes:

  postgres_data:



networks:

  infra-network: