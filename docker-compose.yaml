services:

  api:
    build:
      context: ./api

    expose:
      - "3000"

    environment:
      MESSAGE: ${MESSAGE}

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - infra-network


  postgres:

    image: postgres:17

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}


    volumes:
      - postgres_data:/var/lib/postgresql/data


    ports:
      - "5432:5432"


    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5


    networks:
      - infra-network



volumes:

  postgres_data:



networks:

  infra-network: